# /etc/nginx/sites-available/laprizza  (ligar com: ln -s para /etc/nginx/sites-enabled/)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/laprizza/current;
    index index.html;

    # API: o browser chama /api/v1/... no mesmo endereço do site e o nginx
    # encaminha para o back end que corre nesta VM (porta 3000, só local).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ficheiros com hash no nome (gerados pelo Vite): cache longa
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Nunca em cache, para o browser apanhar sempre a versão nova
    location = /version.json {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer outra rota devolve o index.html (React Router trata do resto)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
