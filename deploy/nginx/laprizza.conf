# /etc/nginx/sites-available/laprizza  (ligar com: ln -s para /etc/nginx/sites-enabled/)
# RGPD (GDP01): os logs de acesso não guardam o endereço IP nem o user agent dos clientes.
# (log_format fica no contexto http: este ficheiro é incluído dentro dele.)
log_format laprizza_no_ip '[$time_local] "$request_method $uri" $status $body_bytes_sent';

# AA04: HTTPS obrigatório. O cookie de refresh é Secure (o browser rejeita-o em HTTP fora de
# localhost) e os Web Locks que serializam o refresh entre separadores só existem em contextos
# seguros. A porta 80 só redireciona.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/laprizza.access.log laprizza_no_ip;

    # Mesmas redes que no 443: um cliente recusado não chega a ver o redirecionamento.
    include /etc/laprizza/allowed-endpoints.conf;

    return 301 https://$host$request_uri;
}

server {
    # "http2" no listen: compatível com nginx < 1.25 (Ubuntu 22.04/24.04); em >= 1.25 dá só um aviso.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    access_log /var/log/nginx/laprizza.access.log laprizza_no_ip;
    # O error_log do nginx inclui "client: <ip>" em cada linha: só erros críticos são guardados.
    error_log /var/log/nginx/laprizza.error.log crit;

    # Certificado da VM (ver docs/sys-admin/https.md). Chave privada: root:root, chmod 600.
    ssl_certificate     /etc/laprizza/tls/fullchain.pem;
    ssl_certificate_key /etc/laprizza/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:laprizza_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Só ativar com um certificado confiável (não autoassinado): o browser memoriza a regra.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/laprizza/current;
    index index.html;
    # SYS02: só as redes aprovadas (allow …; deny all;). Os pedidos recusados recebem 403 e ficam no
    # /var/log/nginx/laprizza.error.log ("access forbidden by rule"). SYS03: o ficheiro é gerado a partir de
    # /etc/laprizza/allowed-clients.conf por laprizza-allowlist-apply.sh – não editar à mão.
    include /etc/laprizza/allowed-endpoints.conf;

    # API: o browser chama /api/v1/... no mesmo endereço do site e o nginx
    # encaminha para o back end que corre nesta VM (porta 3000, só local).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ficheiros com hash no nome (gerados pelo Vite): cache longa
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Nunca em cache, para o browser apanhar sempre a versão nova
    location = /version.json {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer outra rota devolve o index.html (React Router trata do resto)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
