# /etc/nginx/sites-available/laprizza  (PRODUÇÃO, ligar com ln -s para /etc/nginx/sites-enabled/)
#
# Produção (VM vs944): acesso público SEM a allowlist da VPN (SYS02).
#   https://vs-gate.dei.isep.ipp.pt:10944  --(o vs-gate termina o HTTPS)-->  http://vs944:2226  (este nginx)
# A porta 80 não é mapeada para fora, por isso o nginx escuta só na 2226.
# Uma só VM: o nginx serve o SPA e encaminha /api/ para o back end (127.0.0.1:3000).
# O MongoDB (27017) e o serviço Prolog (5000) só escutam em 127.0.0.1 e nunca passam por aqui.

# Formato de log com o IP da ligação e o X-Forwarded-For (tem de ficar fora do server {}).
log_format laprizza_fwd '$remote_addr xff="$http_x_forwarded_for" [$time_local] "$request" $status';

server {
    listen 2226 default_server;
    listen [::]:2226 default_server;
    server_name _;

    server_tokens off;
    root /var/www/laprizza/current;
    index index.html;

    # Regista o IP que o vs-gate envia (X-Forwarded-For): serve para acertar TRUST_PROXY.
    access_log /var/log/nginx/laprizza.access.log laprizza_fwd;

    # Cabeçalhos de segurança do site público
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # same-origin e não no-referrer: com no-referrer o browser envia "Origin: null" nos POST de
    # formulário, e o POST /auth/external/activate (AA07) é recusado pela verificação da Origin.
    add_header Referrer-Policy "same-origin" always;

    # Swagger UI fica fora da produção (a documentação está no repositório e no staging).
    location ~ ^/api/v[0-9]+/docs {
        return 404;
    }

    # API: o browser chama /api/v2/... no mesmo endereço do site.
    location /api/ {
        # Ficheiros partilhados (SYS04): limite de 10 MB no back end, mais margem do pedido.
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # O browser falou HTTPS com o vs-gate; aqui chega HTTP.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Ficheiros com hash no nome (gerados pelo Vite): cache longa
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Nunca em cache, para o browser apanhar sempre a versão nova
    location = /version.json {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # SPA: qualquer outra rota devolve o index.html (React Router trata do resto)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
